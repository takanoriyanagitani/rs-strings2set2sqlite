[package]
name = "rs-strings2set2sqlite"
version = "0.1.0"
edition = "2024"

description = "Insert strings from stdin into a SQLite set"
license = "Apache-2.0"
repository = "https://github.com/takanoriyanagitani/rs-strings2set2sqlite"
homepage = "https://github.com/takanoriyanagitani/rs-strings2set2sqlite"
documentation = "https://docs.rs/rs-strings2set2sqlite/latest"
keywords = ["sqlite", "set", "string", "wasi"]

exclude = [
  "strings2set2sqlite.wasm",
]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"

[profile.release-wasi]
inherits = "release"
lto = true
strip = true
opt-level = 's'
codegen-units = 1

[[bin]]
name = "strings2set2sqlite"

[dependencies.rusqlite]
version = "0.40.2"
default-features = false
features = [
    "bundled",
    "wasm32-wasi-vfs",
]
